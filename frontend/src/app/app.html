<header class="app-header">
  <div class="header-left">
    <h1>🛒 {{ title }}</h1>
    <nav *ngIf="isAuthenticated" class="nav-menu">
      <a routerLink="/" class="nav-item">📦 Pedidos</a>
      <a routerLink="/admin-rabbit" class="nav-item">🐰 Admin RabbitMQ</a>
    </nav>
  </div>

  <div class="auth-section">
    <!-- Mostrar cuando NO está autenticado -->
    <button
      *ngIf="!isAuthenticated"
      class="btn btn-login"
      (click)="login()">
      Iniciar sesión
    </button>

    <!-- Mostrar cuando SÍ está autenticado -->
    <div *ngIf="isAuthenticated" class="user-info">
      <span class="user-name">👤 {{ userName }}</span>
      <button class="btn btn-logout" (click)="logout()">
        Cerrar sesión
      </button>
    </div>
  </div>
</header>

<main class="app-content">
  <router-outlet></router-outlet>
</main>
