spring.cloud.azure.active-directory.app-id-uri=api://7b857d16-52ef-410a-ae0c-c93fb69ce170

# OAuth2 Resource Server - Issuer
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://7630b4fb-6df0-4113-9ed7-fb3287971a77.ciamlogin.com/7630b4fb-6df0-4113-9ed7-fb3287971a77/v2.0
