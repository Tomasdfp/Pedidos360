spring.application.name=backend

# Servidor
server.port=8081

# Spring Cloud Azure - Entra ID
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.client-id=7b857d16-52ef-410a-ae0c-c93fb69ce170
spring.cloud.azure.active-directory.app-id-uri=api://7b857d16-52ef-410a-ae0c-c93fb69ce170

# OAuth2 Resource Server - Issuer
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://7630b4fb-6df0-4113-9ed7-fb3287971a77.ciamlogin.com/7630b4fb-6df0-4113-9ed7-fb3287971a77/v2.0
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://pedidos360tg.ciamlogin.com/7630b4fb-6df0-4113-9ed7-fb3287971a77/discovery/v2.0/keys

# H2 Database (desarrollo)
spring.datasource.url=jdbc:h2:mem:pedidos360
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.azure.spring=DEBUG
logging.level.cl.pedidos360=INFO

# ==============================================================================
# RabbitMQ - Configuración de Conexión
# ==============================================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ==============================================================================
# RabbitMQ - Configuración Centralizada de Exchanges, Colas y Routing Keys
# ==============================================================================
# Exchange principal de pedidos
app.rabbitmq.exchange.pedidos=pedidos.exchange

# Cola principal de procesamiento de pedidos y routing key
app.rabbitmq.queue.pedidos=pedidos.queue
app.rabbitmq.routing-key.pedido-creado=pedido.creado

# Cola de dominio Notificaciones vinculada a pedidos.exchange
app.rabbitmq.queue.notificaciones=notificacion.queue
app.rabbitmq.routing-key.notificaciones=pedido.creado

# ==============================================================================
# RabbitMQ - Dead Letter Exchange (DLX) y Dead Letter Queues (DLQ)
# ==============================================================================
app.rabbitmq.exchange.dlx=pedidos.dlx
app.rabbitmq.queue.pedidos-dlq=pedidos.dlq
app.rabbitmq.routing-key.pedidos-dlq=pedidos.dead-letter

app.rabbitmq.queue.notificaciones-dlq=notificacion.dlq
app.rabbitmq.routing-key.notificaciones-dlq=notificacion.dead-letter

# ==============================================================================
# Apache Kafka - Configuración de Clúster, Tópicos y Consumer Groups
# ==============================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

# Productor Kafka
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retries=3

# Consumidor Kafka
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.pedidos360.*
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=RECORD

# Tópicos Centralizados (Mínimo 2 tópicos, 3 particiones y factor de replicación 3)
app.kafka.topics.pedidos-analitica.name=pedidos.analitica.v1
app.kafka.topics.pedidos-analitica.partitions=3
app.kafka.topics.pedidos-analitica.replicas=3
app.kafka.topics.pedidos-analitica.retention-ms=604800000

app.kafka.topics.pedidos-auditoria.name=pedidos.auditoria.v1
app.kafka.topics.pedidos-auditoria.partitions=3
app.kafka.topics.pedidos-auditoria.replicas=3
app.kafka.topics.pedidos-auditoria.retention-ms=2592000000

# Consumer Groups
app.kafka.consumer-groups.analitica=pedidos-analitica-group
app.kafka.consumer-groups.auditoria=pedidos-auditoria-group


