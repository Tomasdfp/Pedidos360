spring.application.name=rabbit-admin-service
server.port=8082

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.auto-startup=false

app.rabbitmq.exchange.tickets=tickets.exchange
app.rabbitmq.queue.tickets=ticket.queue
app.rabbitmq.routing-key.tickets=ticket.nuevo

app.rabbitmq.exchange.dlx=tickets.dlx
app.rabbitmq.queue.tickets-dlq=ticket.dlq
app.rabbitmq.routing-key.tickets-dlq=ticket.dead-letter
