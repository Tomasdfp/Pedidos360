spring.application.name=rabbit-admin-service

# Servidor en puerto 8082 para no colisionar con pedidos-service (8081)
server.port=8082

# ==============================================================================
# RabbitMQ - Conexión al Broker
# ==============================================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Modo de confirmación manual para control explícito de ACK y DLQ
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ==============================================================================
# RabbitMQ - Dominio de Tickets y Administración Centralizada
# ==============================================================================
app.rabbitmq.exchange.tickets=tickets.exchange
app.rabbitmq.queue.tickets=ticket.queue
app.rabbitmq.routing-key.tickets=ticket.nuevo

# Dead Letter Exchange y DLQ para Tickets
app.rabbitmq.exchange.dlx=tickets.dlx
app.rabbitmq.queue.tickets-dlq=ticket.dlq
app.rabbitmq.routing-key.tickets-dlq=ticket.dead-letter

# Logging
logging.level.cl.pedidos360.admin=INFO
logging.level.org.springframework.amqp=INFO
